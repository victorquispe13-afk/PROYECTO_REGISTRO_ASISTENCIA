<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar mi QR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <h1>Buscar mi registro</h1>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/buscar-qr">
        <label>Nombre:</label><br>
        <input type="text" name="nombre" required><br><br>

        <label>Apellido Paterno:</label><br>
        <input type="text" name="apellido_paterno" required><br><br>

        <label>Apellido Materno:</label><br>
        <input type="text" name="apellido_materno" required><br><br>

        <button type="submit" class="boton boton-buscar">Buscar</button>
    </form>
    <br>
    <a href="/estudiante">← Volver</a>
</body>
</html>
